<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - OT logs</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-header">
      <h1>Sistema de Mantenimiento</h1>
      <p>Control de Órdenes de Trabajo y Recursos</p>
    </div>
    <form id="login-form">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" required autocomplete="username" placeholder="Ej. admin">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <div id="login-error" class="alert alert-error hidden"></div>
      <button type="submit" class="btn btn-primary btn-block">Ingresar al Sistema</button>
    </form>
  </div>
  <script src="/appOT.js"></script>
</body>
</html>
